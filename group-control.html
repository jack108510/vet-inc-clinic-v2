/* Central pricing workspace */
.workspace-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(250px,1fr);gap:16px;margin-bottom:18px}
.recent-panel{margin-top:18px}
.guide-card{padding:22px}
.guide-card h2{font-size:18px;margin:7px 0 14px}
.guide-card ol{padding-left:19px;margin:0 0 16px;display:grid;gap:11px;font-weight:600}
.guide-card p{color:var(--muted);font-size:11px;margin:0}
.overview-stats{margin-bottom:18px}
.journey{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 18px}
.journey span{padding:11px 13px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--muted);font-size:11px;font-weight:700}
.journey span.current{background:#eaf2ff;border-color:#a8cdfb;color:#1757aa}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.schedule-time{display:block;font-size:17px;letter-spacing:-.02em;margin-bottom:7px}
.execution-panel .section strong{display:block;font-size:12px;margin-bottom:7px}
.activity-row{padding:14px 19px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px}
.activity-row strong{font-size:11px}.activity-row small{display:block;color:var(--muted);font-size:10px;margin-top:4px}
@media(max-width:1050px){.workspace-grid{grid-template-columns:1fr}}
